<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Trishna ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffe3e3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            text-align: center;
            font-family: 'Poppins', sans-serif;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(214, 48, 49, 0.15);
            max-width: 450px;
            width: 100%;
            transition: all 0.5s ease;
            position: relative;
            z-index: 10;
            border: 2px solid #fff;
        }

        .gif-container {
            height: 140px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gif-container img {
            height: 100%;
            border-radius: 15px;
        }

        h1 {
            color: #d63031;
            font-size: 24px;
            margin-bottom: 25px;
            line-height: 1.5;
            min-height: 72px;
        }

        .romantic-text {
            font-family: 'Dancing Script', cursive;
            font-size: 32px;
            color: #b33939;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            min-height: 60px;
            width: 100%;
        }

        button {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff7675, #d63031);
            color: white;
            box-shadow: 0 5px 15px rgba(214, 48, 49, 0.3);
            z-index: 10;
        }

        #yesBtn:hover {
            transform: scale(1.05);
        }

        #noBtn {
            background-color: #b2bec3;
            color: white;
            z-index: 10;
            transition: all 0.1s ease-out;
        }

        /* Floating Hearts */
        .heart {
            position: absolute;
            background-color: #ff7675;
            display: inline-block;
            height: 20px;
            transform: rotate(-45deg);
            width: 20px;
            animation: float 4s linear infinite;
            border-radius: 50% 50% 0 0;
        }

        .heart:before, .heart:after {
            content: "";
            background-color: #ff7675;
            border-radius: 50%;
            height: 20px;
            position: absolute;
            width: 20px;
        }
        .heart:before { top: -10px; left: 0; }
        .heart:after { left: 10px; top: 0; }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(-45deg) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(-45deg) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="gif-container">
            <img id="displayGif" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3N2NTA1bXNydXBlYmlkb2d2YW80YTB6NmZtbzZidms0M2t4MWRhdiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/c7stAY96B4p4DAnO67/giphy.gif" alt="Cute Bear">
        </div>
        
        <h1 id="question">I have something to tell you, will you listen?</h1>
        
        <div class="btn-container" id="btnContainer">
            <button id="yesBtn" onclick="nextStep()">Yes</button>
            <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
        </div>
    </div>

    <script>
        let currentStep = 1;
        let yesScale = 1;
        const questionText = document.getElementById('question');
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const displayGif = document.getElementById('displayGif');

        function moveNoButton() {
            // No button-e hover ba touch korle fixed hoye screen-er onno kothao chole jabe
            noBtn.style.position = 'fixed';

            const padding = 60;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';

            // No er dike gele Yes button prothome dheere dheere boro hobe
            yesScale += 0.2;
            yesBtn.style.transform = `scale(${yesScale})`;
        }

        function nextStep() {
            if (currentStep === 1) {
                // Step 2: Trishna I love you
                displayGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbXp4bW16Z3N6bXp4bXp4bXp4bXp4bXp4bXp4bXp4bXp4bSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/L4lvBIFFKYGaA/giphy.gif"; 
                
                questionText.innerHTML = "Trishna I love you ❤️<br>Will you be my girlfriend?";
                
                // Yes button reset 
                yesScale = 1;
                yesBtn.style.transform = `scale(${yesScale})`;
                
                // No button abar card er bhetor normal static positions e niye asha
                noBtn.style.position = 'static'; 
                
                // Falling hearts start
                setInterval(createHeart, 250);
                currentStep = 2;
            } else if (currentStep === 2) {
                // Final Step: Response
                displayGif.src = "https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbXp4bW16Z3N6bXp4bXp4bXp4bXp4bXp4bXp4bXp4bXp4bSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/14srM6XALUe2Sg/giphy.gif"; 
                
                questionText.innerHTML = "I have waited so long for you, you are the only one 💖";
                questionText.classList.add('romantic-text');
                
                // Card theke button container ganeb kore deya
                document.getElementById('btnContainer').style.display = 'none';
            }
        }

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 2 + 2 + "s";
            heart.style.background = `hsl(${Math.random() * 20 + 340}, 100%, 65%)`;
            document.body.appendChild(heart);
            
            setTimeout(() => { heart.remove(); }, 4000);
        }
    </script>
</body>
</html>
